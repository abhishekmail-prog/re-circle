# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/recircle_db
spring.datasource.username=recircle_user
spring.datasource.password=Recircle@2024
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (MUST match frontend)
jwt.secret=reCircleSecretKey2024ForHackathonProjectSecure
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
upload.dir=./uploads

# Static Resources
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.web.resources.add-mappings=true

# Logging
logging.level.com.recircle=DEBUG
logging.level.org.springframework.security=DEBUG
