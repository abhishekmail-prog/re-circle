# ─── Server ─────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=recircle-backend

# ─── Database (local + Render) ──────────────────────────
# Local default points at localhost.
# Render provides DATABASE_URL (postgres:// format) which is
# handled by DatabaseConfig.java. SPRING_DATASOURCE_* are also
# supported as fallbacks.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recircle_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Recircle@2024}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── JWT ─────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:reCircleSecretKey2024ForHackathonProjectSecure}
jwt.expiration=86400000

# ─── File uploads ────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
upload.dir=./uploads
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.web.resources.add-mappings=true

# ─── Logging ─────────────────────────────────────────────
logging.level.com.recircle=INFO
logging.level.org.springframework.security=WARN

# ─── CORS ────────────────────────────────────────────────
# Production: set CORS_ALLOWED_ORIGINS env var on Render
# Example: https://re-circle.vercel.app,https://re-circle-git-main-xyz.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
